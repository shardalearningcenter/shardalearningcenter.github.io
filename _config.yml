title: ShardaLearningCenter
email: s.learnkarma@gmail.com
description: >- 
  Learn to code by building real projects. Fast. Practical. No fluff.
baseurl: "" 
url: "https://shardalearningcenter.github.io" 
theme: jekyll-theme-architect
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Colorful code syntax highlighting (Rouge on GitHub Pages)
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

# 👇 Add this to show menu in navbar
minima:
  skin: auto
  social_links: []
  navigation:
    - title: "Home"
      url: "/"
    - title: "Courses"
      url: "/courses/"
    - title: "Python Bootcamp"
      url: "/python-bootcamp/"
    - title: "Golang Bootcamp"
      url: "/golang-bootcamp/"
    - title: "Blog"
      url: "/blog/"
    - title: "About"
      url: "/about/"
    
