title: Sharda Learning Center
email: s.learnkarma@gmail.com
description: >-
  Learn to code by building real projects. Fast. Practical. No fluff.
baseurl: ""
url: "https://shardalearningcenter.github.io"
plugins:
  - jekyll-feed
markdown: kramdown
permalink: /:year/:month/:day/:title/
defaults:
  - scope:
      path: "courses"
    values:
      layout: course
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
